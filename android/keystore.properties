# ============================================================================
# TEST-ONLY signing config for release.keystore (also committed in this repo).
#
# This lets `./gradlew assembleRelease` produce a signed, installable APK
# immediately, with zero setup. It is NOT safe for real store submission:
# anyone who has this repo has this keystore, so anyone could sign an update
# to your app if you ever published with it.
#
# BEFORE PUBLISHING TO GOOGLE PLAY OR THE AMAZON APPSTORE:
#   1. Generate your own private keystore, e.g.:
#        keytool -genkeypair -v -keystore my-release.keystore -alias myalias \
#          -keyalg RSA -keysize 2048 -validity 10000
#   2. Replace the values below with your own (and swap storeFile to point at
#      your new .keystore file placed in android/).
#   3. Never commit your real keystore or these real passwords to git -
#      keep them out of version control (this file is already gitignored
#      once you put real secrets in it - see .gitignore).
#   4. For CI builds, store the keystore (base64-encoded) and these values as
#      GitHub Actions secrets instead - see .github/workflows/android.yml.
# ============================================================================
storeFile=release.keystore
storePassword=changeit123
keyAlias=iqsurge
keyPassword=changeit123
